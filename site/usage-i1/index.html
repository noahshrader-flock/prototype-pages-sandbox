<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Console: Team usage (sandbox prototype)</title><style>:root { color-scheme: light; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1c2430; }
body { margin: 0; background: #f6f8fb; }
.page { min-height: 100vh; padding-bottom: 72px; }
.top { display: flex; align-items: center; gap: 28px; padding: 0 28px; height: 52px; background: #1d3557; color: #fff; }
.top nav { display: flex; gap: 20px; flex: 1; }
.top nav span { opacity: .75; font-size: 14px; }
.top nav .on { opacity: 1; border-bottom: 2px solid #8fb8e8; padding-bottom: 4px; }
.who { font-size: 13px; opacity: .85; }
.banner { background: #fff6dd; border-bottom: 1px solid #ecd9a0; padding: 10px 28px; font-size: 13px; }
.banner a { color: #1f4f8f; font-weight: 600; }
main { max-width: 1080px; margin: 0 auto; padding: 28px; }
h1 { font-size: 28px; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 28px 0 10px; }
.lede, .muted { color: #5b6677; font-size: 14px; }
table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dde3ec; border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #edf0f5; }
th { background: #eef2f8; font-weight: 600; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { text-align: left; background: #fff; border: 1px solid #dde3ec; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; font: inherit; }
.card:hover { border-color: #3b6ea8; }
button.link { background: none; border: 0; color: #1f4f8f; text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
.ghost { background: none; border: 1px solid #c8d1de; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 340px; background: #fff; border-left: 1px solid #dde3ec; padding: 20px; box-shadow: -8px 0 24px rgba(20,30,50,.08); }
.states { position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid #c8d1de; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.states button { border: 1px solid transparent; background: #eef2f8; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.states button.on { background: #1d3557; color: #fff; }
</style></head>
